*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ede4d3;--bg2:#e3d8c5;--bg3:#d6c9b2;--surface:#f8f2e8;

@media(prefers-color-scheme:dark){

  }
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden;padding-top:var(--safe-top)}
input,textarea,select{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--input-bg);-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink3)}
button{cursor:pointer;font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{display:none}
scrollbar-width:none;
select option{background:var(--bg);color:var(--ink)}
.ticker-wrap{overflow:hidden;padding:10px 0;background:var(--ink)}
.ticker-track{display:flex;width:max-content;animation:tick 28s linear infinite;will-change:transform}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes celebrate{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes wheelSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .28s ease forwards}
.slide-up{animation:slideUp .35s cubic-bezier(.16,1,.3,1) forwards}
.celebrate{animation:celebrate .4s cubic-bezier(.16,1,.3,1) forwards}
.wheel-spin{animation:wheelSpin .5s ease forwards}
.field{border:1.5px solid var(--rule);border-radius:10px;padding:13px 14px;font-size:15px;background:var(--input-bg);color:var(--ink);width:100%;outline:none;transition:border .2s;display:block}
.field:focus{border-color:var(--red)}
textarea.field{resize:none}
.rule-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink3);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;flex-shrink:0;color:transparent}
.rule-check.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:1.5px solid var(--ink);display:flex;z-index:100;padding-bottom:var(--safe-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 0;border:none;background:none;cursor:pointer;border-top:2.5px solid transparent;transition:border .15s}
.nav-btn.active{border-top-color:var(--red)}
.sp0{background:#6b5a4e}.sp1{background:#3d5a6b}.sp2{background:#5a4e6b}
.sp3{background:#3d6b52}.sp4{background:#6b4e3d}.sp5{background:#4e5a3d}
.sp6{background:#6b3d4e}.sp7{background:#3d4e6b}.sp8{background:#5a6b3d}
@media(prefers-color-scheme:dark){

function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function todayKey(){return new Date().toISOString().split("T")[0];}
function getStreak(logs){let s=0,d=new Date();while(true){const k=d.toISOString().split("T")[0];if(logs[k]?.perfect){s++;d.setDate(d.getDate()-1);}else break;}return s;}
function getPerfectDays(logs){return Object.values(logs).filter(d=>d.perfect).length;}
function getCurrentDay(sd){if(!sd)return null;const d=Math.floor((new Date()-new Date(sd))/86400000)+1;return d>=1&&d<=75?d:d>75?75:null;}
function fmtTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}

}

function RuleRow({rule,num,log,onUpdate,onReset,books}){
  const [open,setOpen]=useState(false);
  const done=log?.done||false;
  const currentBook=books?.find(b=>b.status==="reading");
  function toggle(){onUpdate({...log,done:!done,timestamp:new Date().toISOString()});}
  function upd(f,v){onUpdate({...log,done:log?.done,[f]:v});}
  const subTxt=()=>{
    if(rule.type==="steps"&&log?.steps)return`${Number(log.steps).toLocaleString()} / 10,000 steps`;
    if(rule.type==="water"&&log?.ml)return`${log.ml}ml / 3,000ml`;
    if(rule.type==="reading"&&log?.pages)return`${log.pages} pages · ${currentBook?.title||""}`;
    return rule.desc;
  };
  return(
    <div style={{borderBottom:"1px solid var(--rule)"}}>
      <div style={{display:"flex",alignItems:"center",padding:"14px 0",cursor:"pointer"}} onClick={()=>rule.type==="check"?toggle():setOpen(!open)}>
        <div style={{width:32,flexShrink:0,fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:done?"var(--red)":"var(--ink3)",lineHeight:1}}>{String(num).padStart(2,"0")}</div>
        <div style={{width:44,height:44,flexShrink:0,marginRight:14,background:done?"var(--ink)":"var(--bg2)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,position:"relative",boxShadow:"1px 2px 0 rgba(0,0,0,.08)",transition:"background .2s"}}>
          {rule.icon}
          {done&&<div style={{position:"absolute",top:-7,left:"50%",transform:"translateX(-50%)",width:20,height:10,background:"rgba(168,135,58,.35)",borderRadius:1}}/>}
        </div>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Lora',serif",fontSize:15,fontWeight:500,color:done?"var(--ink2)":"var(--ink)",textDecoration:done?"line-through":"none",textDecorationColor:"var(--red)"}}>{rule.name}</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"var(--ink2)",marginTop:2,lineHeight:1.3}}>{subTxt()}</div>
        </div>
        <div style={{marginRight:4,display:"flex",alignItems:"center",gap:10}}>
          {rule.type!=="check"&&<span style={{fontSize:12,color:"var(--ink3)"}}>{open?"▲":"▼"}</span>}
          <div onClick={e=>{e.stopPropagation();toggle();}} className={`rule-check${done?" done":""}`}>✓</div>
        </div>
      </div>
      {open&&rule.type!=="check"&&(
        <div className="fade-in" style={{paddingBottom:16,paddingLeft:90,paddingRight:8}}>
          {rule.type==="workout"&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <select value={log?.wtype||""} onChange={e=>upd("wtype",e.target.value)} className="field">
                <option value="">Type of workout...</option>
                <option>Strength Training</option><option>Jump Rope</option><option>Cardio — Running</option>
                <option>Cardio — Cycling</option><option>Cardio — Rowing</option><option>HIIT</option>
                <option>Pilates</option><option>Yoga / Mobility</option><option>Swimming</option>
                <option>Boxing / Kickboxing</option><option>Barre</option><option>Dance</option>

function TodayPage({appState,setAppState}){
  const {startDate,logs,rules}=appState;
  const realToday=todayKey();
  const [activeDate,setActiveDate]=useState(realToday);
  const isToday=activeDate===realToday;

  // Clamp activeDate to valid range when startDate changes
  useEffect(()=>{
    if(startDate&&activeDate<startDate)setActiveDate(startDate);
    if(activeDate>realToday)setActiveDate(realToday);
  },[startDate]);

  const activeLog=logs[activeDate]||{};
  const day=getCurrentDay(startDate);
  // Day number for the active (possibly past) date
  const activeDayNum=startDate?Math.floor((new Date(activeDate)-new Date(startDate))/86400000)+1:null;
  const pct=day?Math.round((day/75)*100):0;
  const doneCount=rules.filter(r=>activeLog[r.id]?.done).length;
  const allDone=doneCount===8;

  // Navigate dates — only within challenge range
  function prevDay(){
    if(!startDate)return;
    const d=new Date(activeDate);d.setDate(d.getDate()-1);
    const k=d.toISOString().split("T")[0];
    if(k>=startDate)setActiveDate(k);
  }
  function nextDay(){
    const d=new Date(activeDate);d.setDate(d.getDate()+1);
    const k=d.toISOString().split("T")[0];
    if(k<=realToday)setActiveDate(k);
  }

  function updateRuleLog(ruleId,val){
    const newLog={...logs,[activeDate]:{...activeLog,[ruleId]:val}};
    const dayDone=rules.every(r=>(r.id===ruleId?val.done:newLog[activeDate]?.[r.id]?.done));
    if(dayDone)newLog[activeDate].perfect=true;else delete newLog[activeDate].perfect;
    setAppState(s=>({...s,logs:newLog}));
  }
  function resetRuleLog(ruleId){
    const newLog={...logs,[activeDate]:{...activeLog}};
    delete newLog[activeDate][ruleId];delete newLog[activeDate].perfect;
    setAppState(s=>({...s,logs:newLog}));
  }
  function startChallenge(){
    setAppState(s=>({...s,startDate:realToday,startTime:new Date().toISOString(),restarts:[...(s.restarts||[])]}));
    setActiveDate(realToday);
  }

  const isPast=activeDate<realToday;
  const canGoPrev=startDate&&activeDate>startDate;
  const canGoNext=activeDate<realToday;

  return(
    <div style={{paddingBottom:90}}>
      <Ticker/>
      <TopBar day={day}/>
      <Hero day={day} pct={pct}/>
      <StatCards streak={getStreak(logs)} perfect={getPerfectDays(logs)} todayScore={rules.filter(r=>(logs[realToday]||{})[r.id]?.done).length} remaining={day?75-day:null}/>
      <AffirmationCard day={day}/>
      {!startDate&&(
        <div style={{margin:"0 20px 20px"}}>
          <button onClick={startChallenge} style={{width:"100%",padding:18,background:"var(--ink)",color:"var(--bg)",border:"none",borderRadius:14,fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:4,boxShadow:"3px 4px 0 rgba(0,0,0,.12)"}}>✦ START THE LOCK IN ✦</button>
        </div>
      )}
      {startDate&&(
        <div style={{margin:"0 20px 16px",display:"flex",alignItems:"center",gap:0,border:"1.5px solid var(--ink)",borderRadius:12,overflow:"hidden"}}>
          <button onClick={prevDay} disabled={!canGoPrev} style={{flex:"none",padding:"12px 16px",background:"none",border:"none",fontSize:18,color:canGoPrev?"var(--ink)":"var(--ink3)",borderRight:"1px solid var(--rule)"}}>←</button>
          <div style={{flex:1,textAlign:"center",padding:"10px 0"}}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:"var(--ink)"}}>{activeDate===realToday?"Today":activeDate}</div>
            {activeDayNum&&activeDayNum>=1&&activeDayNum<=75&&<div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:isPast?"var(--gold)":"var(--ink2)",marginTop:2}}>{isPast?"Past — Day "+activeDayNum:"Day "+activeDayNum+" of 75"}</div>}
          </div>
          <button onClick={nextDay} disabled={!canGoNext} style={{flex:"none",padding:"12px 16px",background:"none",border:"none",fontSize:18,color:canGoNext?"var(--ink)":"var(--ink3)",borderLeft:"1px solid var(--rule)"}}>→</button>
          {!isToday&&<button onClick={()=>setActiveDate(realToday)} style={{flex:"none",padding:"12px 14px",background:"var(--ink)",border:"none",fontSize:11,color:"var(--bg)",fontFamily:"'Raleway',sans-serif",letterSpacing:1,textTransform:"uppercase"}}>Now</button>}
        </div>
      )}
      {isPast&&(
        <div style={{margin:"-8px 20px 14px",background:"rgba(168,135,58,.12)",border:"1px solid var(--gold)",borderRadius:10,padding:"9px 14px",display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14}}>✏️</span>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"var(--gold)",lineHeight:1.4}}>Editing past day — all changes save immediately.</div>
        </div>
      )}
      <div style={{padding:"0 20px"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:8,paddingBottom:14,borderBottom:"2px solid var(--ink)"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:2}}>{isToday?"Today's Rules":"Day's Rules"}</div>
          <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)"}}>tap to expand</div>
          <div style={{marginLeft:"auto",fontFamily:"'Playfair Display',serif",fontSize:15,fontStyle:"italic",color:"var(--red)"}}>{doneCount} of 8</div>
        </div>
      </div>
      <div style={{padding:"0 20px"}}>
        {rules.map((r,i)=>(
          <RuleRow key={r.id+activeDate} rule={r} num={i+1} log={activeLog[r.id]} onUpdate={v=>updateRuleLog(r.id,v)} onReset={()=>resetRuleLog(r.id)} books={appState.books}/>
        ))}
        <div style={{height:2,background:"var(--ink)"}}/>
      </div>
      {allDone&&(
        <div className={isToday?"celebrate":""} style={{margin:"20px",background:"var(--ink)",border:"2px solid var(--red)",borderRadius:14,padding:"22px",textAlign:"center"}}>
          <div style={{fontFamily:"'Dancing Script',cursive",fontSize:32,color:"var(--red)",marginBottom:6}}>{isToday?`Day ${day} Complete`:`Day ${activeDayNum} Logged ✦`}</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:14,color:"#f0e6cc",opacity:.8}}>{isToday?"She showed up. She always does.":"Backdated and saved."}</div>
        </div>
      )}
    </div>
  );
}

function WeeklyReview({appState,weekNum,onClose}){
  const {startDate,logs,rules}=appState;
  if(!startDate)return null;

  // Calculate the 7 days for this week number (1-indexed)
  const weekStart=new Date(startDate);
  weekStart.setDate(weekStart.getDate()+(weekNum-1)*7);
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const key=d.toISOString().split("T")[0];
    const dayNum=(weekNum-1)*7+i+1;
    const log=logs[key]||{};
    const done=rules.filter(r=>log[r.id]?.done).length;
    return{key,dayNum,done,perfect:!!log.perfect,label:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]};
  });

  const today=todayKey();
  const pastDays=days.filter(d=>d.key<=today);
  const totalDone=pastDays.reduce((a,d)=>a+d.done,0);
  const maxPossible=pastDays.length*8;
  const pct=maxPossible>0?Math.round((totalDone/maxPossible)*100):0;
  const perfectCount=pastDays.filter(d=>d.perfect).length;
  const bestDay=pastDays.reduce((best,d)=>d.done>best.done?d:best,{done:-1});
  const totalSteps=pastDays.reduce((a,d)=>{const s=logs[d.key]?.r3?.steps||0;return a+Number(s);},0);
  const totalWater=pastDays.reduce((a,d)=>{const w=logs[d.key]?.r4?.ml||0;return a+Number(w);},0);
  const totalPages=pastDays.reduce((a,d)=>{const p=logs[d.key]?.r5?.pages||0;return a+Number(p);},0);
  // Nutrition weekly averages
  const nutDays=pastDays.filter(d=>logs[d.key]?.r8?.cal);
  const avgCal=nutDays.length>0?Math.round(nutDays.reduce((a,d)=>a+Number(logs[d.key].r8.cal||0),0)/nutDays.length):0;
  const avgProt=nutDays.length>0?Math.round(nutDays.reduce((a,d)=>a+Number(logs[d.key].r8?.protein||0),0)/nutDays.length):0;
  const calMin=load("cal_target_min",1100),calMax=load("cal_target_max",1400);
  const protMin=load("prot_target_min",100),protMax=load("prot_target_max",140);
  const calOk=avgCal>=calMin&&avgCal<=calMax;
  const worstRule=()=>{
    const counts={};
    rules.forEach(r=>{counts[r.id]=pastDays.filter(d=>(logs[d.key]||{})[r.id]?.done).length;});
    const minId=Object.keys(counts).reduce((a,b)=>counts[a]<counts[b]?a:b);
    return rules.find(r=>r.id===minId);
  };
  const wr=worstRule();

  // Journal saved for this week
  const [reviewNote,setReviewNote]=useState(()=>load(`week_review_${weekNum}`,""));
  useEffect(()=>save(`week_review_${weekNum}`,reviewNote),[reviewNote]);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:250,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div className="slide-up" onClick={e=>e.stopPropagation()} style={{background:"var(--bg)",width:"100%",borderRadius:"20px 20px 0 0",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{padding:"20px 20px 0"}}>
          <div style={{width:40,height:4,background:"var(--rule)",borderRadius:2,margin:"0 auto 20px"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
            <div>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:4,textTransform:"uppercase",color:"var(--ink2)"}}>Weekly Review</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:36,letterSpacing:2,color:"var(--ink)",lineHeight:1}}>Week {weekNum}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"'Abril Fatface',serif",fontSize:36,color:pct>=80?"var(--red)":pct>=60?"var(--gold)":"var(--ink3)",lineHeight:1}}>{pct}%</div>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Completion</div>
            </div>
          </div>
          <div style={{height:6,background:"var(--bg3)",borderRadius:4,overflow:"hidden",marginBottom:20}}>
            <div style={{height:"100%",width:`${pct}%`,background:pct>=80?"var(--red)":pct>=60?"var(--gold)":"var(--ink3)",borderRadius:4,transition:"width .5s"}}/>
          </div>
        </div>

        {/* Day grid */}
        <div style={{padding:"0 20px",marginBottom:20}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
            {days.map(d=>{
              const isFuture=d.key>today;
              const bg=d.perfect?"var(--ink)":d.done>=6?"rgba(200,58,79,.7)":d.done>=3?"rgba(200,58,79,.35)":d.done>0?"rgba(200,58,79,.15)":"var(--bg2)";

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",borderTop:"1px solid var(--rule)",borderBottom:"1px solid var(--rule)",marginBottom:20}}>
          {[[perfectCount,"Perfect","✦","var(--red)"],[totalSteps>0?Math.round(totalSteps/1000)+"k":"—","Steps","👟","var(--ink)"],[totalWater>0?Math.round(totalWater/1000)+"L":"—","Water","💧","var(--accent-blue)"],[totalPages||"—","Pages","📖","var(--gold)"]].map(([n,l,icon,c],i)=>(
            <div key={i} style={{padding:"14px 0",textAlign:"center",borderRight:i<3?"1px solid var(--rule)":"none"}}>
              <div style={{fontSize:14,marginBottom:2}}>{icon}</div>
              <div style={{fontFamily:"'Abril Fatface',serif",fontSize:20,color:c,lineHeight:1}}>{n}</div>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:8,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)",marginTop:2}}>{l}</div>

            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:2,marginBottom:10}}>Nutrition This Week</div>
            <div style={{background:"var(--card-bg)",border:"1.5px solid var(--ink)",borderRadius:12,padding:"14px 16px",boxShadow:"2px 3px 0 rgba(0,0,0,.07)"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'Abril Fatface',serif",fontSize:22,color:calOk?"#4caf50":avgCal>calMax?"var(--red)":"var(--ink)",lineHeight:1}}>{avgCal}</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"var(--ink2)",marginTop:2}}>avg kcal/day</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:"var(--ink3)"}}>target {calMin}–{calMax}</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'Abril Fatface',serif",fontSize:22,color:avgProt>=protMin?"#4caf50":"var(--gold)",lineHeight:1}}>{avgProt}g</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"var(--ink2)",marginTop:2}}>avg protein/day</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:"var(--ink3)"}}>target {protMin}–{protMax}g</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'Abril Fatface',serif",fontSize:22,color:"var(--ink)",lineHeight:1}}>{nutDays.length}</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"var(--ink2)",marginTop:2}}>days logged</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:9,color:"var(--ink3)"}}>of {pastDays.length} days</div>
                </div>
              </div>
              <div style={{height:5,background:"var(--bg3)",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min(100,(avgCal/calMax)*100)}%`,background:calOk?"#4caf50":avgCal>calMax?"var(--red)":"var(--accent-blue)",borderRadius:4}}/>
              </div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginTop:6}}>{calOk?"✓ Avg calories within target range":avgCal>calMax?"↑ Avg calories above target — tighten up":"↓ Avg calories below target — eat more, hit protein"}</div>
            </div>
          </div>
        )}

        {/* Insights */}
        <div style={{padding:"0 20px",marginBottom:20}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:12}}>This Week's Insights</div>
          {bestDay.done>0&&(
            <div style={{background:"var(--card-bg)",border:"1.5px solid var(--ink)",borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"2px 3px 0 rgba(0,0,0,.07)"}}>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--red)",marginBottom:4}}>Best Day</div>
              <div style={{fontFamily:"'Lora',serif",fontSize:15,fontWeight:600,color:"var(--ink)"}}>{bestDay.label} — {bestDay.done}/8 rules</div>
              {bestDay.perfect&&<div style={{fontFamily:"'Dancing Script',cursive",fontSize:15,color:"var(--gold)",marginTop:4}}>✦ Perfect day</div>}
            </div>
          )}
          {wr&&pastDays.length>0&&(
            <div style={{background:"var(--card-bg)",border:"1.5px solid var(--ink)",borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"2px 3px 0 rgba(0,0,0,.07)"}}>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--gold)",marginBottom:4}}>Needs Attention</div>
              <div style={{fontFamily:"'Lora',serif",fontSize:15,fontWeight:600,color:"var(--ink)"}}>{wr.icon} {wr.name}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:"var(--ink2)",marginTop:3}}>Hit {pastDays.filter(d=>(logs[d.key]||{})[wr.id]?.done).length} of {pastDays.length} days this week</div>
            </div>
          )}
          <div style={{background:"var(--card-bg)",border:"1.5px solid var(--ink)",borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"2px 3px 0 rgba(0,0,0,.07)"}}>
            <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:4}}>Completion Rate</div>
            <div style={{fontFamily:"'Lora',serif",fontSize:15,fontWeight:600,color:"var(--ink)"}}>
              {pct>=80?"Strong week. She showed up.":pct>=60?"Solid effort — push harder next week.":pct>=40?"Below target. What got in the way?":"This week was hard. Reset and recommit."}
            </div>
          </div>
        </div>

        {/* Weekly note */}
        <div style={{padding:"0 20px 32px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:4}}>Your Week in One Line</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:12,color:"var(--ink2)",marginBottom:10}}>What defined this week? What are you taking into next week?</div>
          <textarea value={reviewNote} onChange={e=>setReviewNote(e.target.value)} rows={3} placeholder="Write here..." className="field" style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:16,lineHeight:1.6,marginBottom:14}}/>
          <button onClick={onClose} style={{width:"100%",padding:14,background:"var(--ink)",color:"var(--bg)",border:"none",borderRadius:12,fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:3}}>Done</button>
        </div>
      </div>
    </div>
  );
}

function JourneyPage({appState}){
  const {startDate,logs}=appState;
  const [sub,setSub]=useState("week");
  const [selectedDay,setSelectedDay]=useState(null);
  const [reviewWeek,setReviewWeek]=useState(null);
  const day=getCurrentDay(startDate);
  const currentWeekNum=day?Math.ceil(day/7):1;

  const weekDays=Array.from({length:7},(_,i)=>{
    const now=new Date();
    const dow=now.getDay();
    const distToMon=dow===0?-6:1-dow;
    const mon=new Date(now); mon.setDate(now.getDate()+distToMon);
    const t=new Date(mon); t.setDate(mon.getDate()+i);
    return{key:t.toISOString().split("T")[0],label:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i],num:t.getDate()};
  });

  function cellColor(key){
    const l=logs[key];if(!l)return null;
    const n=Object.values(l).filter(v=>v?.done).length;
    if(n===8)return"var(--ink)";if(n>=6)return"rgba(200,58,79,.75)";
    if(n>=3)return"rgba(200,58,79,.42)";if(n>0)return"rgba(200,58,79,.2)";return null;
  }

  const all75=startDate?Array.from({length:75},(_,i)=>{
    const d=new Date(startDate);d.setDate(d.getDate()+i);
    return{key:d.toISOString().split("T")[0],n:i+1};
  }):[];

  const monthCells=()=>{
    const now=new Date();
    const y=now.getFullYear(),m=now.getMonth();
    const first=new Date(y,m,1);
    const offset=(first.getDay()+6)%7;
    const dim=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<offset;i++)cells.push(null);
    for(let d=1;d<=dim;d++){
      // Use local date parts to avoid UTC offset shifting the date
      const pad=n=>String(n).padStart(2,"0");
      const key=`${y}-${pad(m+1)}-${pad(d)}`;
      cells.push({num:d,key});
    }
    return cells;
  };

  return(
    <div style={{paddingBottom:90}}>
      <Ticker/>
      <TopBar day={day}/>
      <div style={{padding:"18px 20px 0"}}>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:48,letterSpacing:-2,lineHeight:.9,color:"var(--ink)"}}>Journey</div>
        <div style={{fontFamily:"'Dancing Script',cursive",fontSize:22,color:"var(--red)"}}>your 75-day map</div>
      </div>
      <div style={{display:"flex",margin:"16px 20px 0",borderBottom:"2px solid var(--ink)"}}>
        {["week","month","all75"].map(s=>(
          <button key={s} onClick={()=>setSub(s)} style={{flex:1,padding:"12px 0",border:"none",borderBottom:sub===s?"3px solid var(--red)":"3px solid transparent",background:"none",fontFamily:"'Raleway',sans-serif",fontSize:11,letterSpacing:3,textTransform:"uppercase",color:sub===s?"var(--red)":"var(--ink2)",marginBottom:-2}}>
            {s==="week"?"Week":s==="month"?"Month":"All 75"}
          </button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",borderBottom:"1px solid var(--rule)"}}>
        {[["🔥",getStreak(logs),"Streak"],["✦",getPerfectDays(logs),"Perfect"],["◈",day||"—","Day"]].map(([icon,n,l],i)=>(
          <div key={i} style={{padding:"18px 0",textAlign:"center",borderRight:i<2?"1px solid var(--rule)":"none"}}>
            <div style={{fontSize:20,marginBottom:4}}>{icon}</div>
            <div style={{fontFamily:"'Abril Fatface',serif",fontSize:26,color:"var(--ink)",lineHeight:1}}>{n}</div>
            <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)",marginTop:3}}>{l}</div>
          </div>
        ))}
      </div>

      {sub==="week"&&(
        <div style={{padding:"20px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:14}}>This Week</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
            {weekDays.map(d=>{
              const bg=cellColor(d.key),isToday=d.key===todayKey();
              return(
                <div key={d.key} onClick={()=>setSelectedDay(d.key)} style={{borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"10px 0",gap:3,background:isToday?"var(--red)":bg||"var(--bg2)",border:isToday?"none":"1px dashed var(--rule)",cursor:"pointer"}}>
                  <div style={{fontFamily:"'Raleway',sans-serif",fontSize:7,letterSpacing:1,textTransform:"uppercase",color:isToday||bg?"#fff":"var(--ink2)"}}>{d.label}</div>
                  <div style={{fontFamily:"'Abril Fatface',serif",fontSize:17,lineHeight:1,color:isToday||bg?"#fff":"var(--ink3)"}}>{d.num}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sub==="month"&&(
        <div style={{padding:"20px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:14}}>This Month</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5,marginBottom:6}}>
            {["M","T","W","T","F","S","S"].map((d,i)=>(
              <div key={i} style={{textAlign:"center",fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:1,color:"var(--ink2)",paddingBottom:4}}>{d}</div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
            {monthCells().map((cell,i)=>{
              if(!cell)return<div key={i}/>;
              const bg=cellColor(cell.key),isToday=cell.key===todayKey();
              return(
                <div key={i} onClick={()=>setSelectedDay(cell.key)} style={{aspectRatio:1,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",background:isToday?"var(--red)":bg||"var(--bg2)",cursor:"pointer",border:isToday?"none":"1px dashed var(--rule)"}}>
                  <span style={{fontFamily:"'Abril Fatface',serif",fontSize:13,color:isToday||bg?"#fff":"var(--ink3)"}}>{cell.num}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sub==="all75"&&(
        <div style={{padding:"20px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:14}}>All 75 Days</div>
          {!startDate?(
            <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",color:"var(--ink2)",fontSize:14}}>Start your challenge to see the full map.</div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
              {all75.map(d=>{
                const bg=cellColor(d.key),isToday=d.key===todayKey();
                return(
                  <div key={d.n} onClick={()=>setSelectedDay(d.key)} style={{aspectRatio:1,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",background:isToday?"var(--red)":bg||"var(--bg2)",cursor:"pointer",border:isToday?"none":"1px dashed var(--rule)"}}>
                    <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:12,color:isToday||bg?"#fff":"var(--ink3)"}}>{d.n}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Weekly Review button — shown when on week sub */}
      {sub==="week"&&startDate&&(
        <div style={{padding:"0 20px 20px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,marginBottom:12}}>Weekly Reviews</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {Array.from({length:Math.ceil(75/7)},(_,i)=>{
              const wNum=i+1;
              const wStart=new Date(startDate);wStart.setDate(wStart.getDate()+(wNum-1)*7);
              const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+6);
              const wStartKey=wStart.toISOString().split("T")[0];
              const today=todayKey();
              const isAccessible=wStartKey<=today;
              const isCurrentWeek=wNum===currentWeekNum;
              const wDays=Array.from({length:7},(_,j)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+j);return d.toISOString().split("T")[0];});
              const pastWDays=wDays.filter(k=>k<=today&&k>=startDate);
              const done=pastWDays.reduce((a,k)=>a+appState.rules.filter(r=>(logs[k]||{})[r.id]?.done).length,0);
              const max=pastWDays.length*8;
              const pct=max>0?Math.round((done/max)*100):0;
              const reviewSaved=!!load(`week_review_${wNum}`,"");
              if(!isAccessible)return null;
              return(
                <div key={wNum} onClick={()=>setReviewWeek(wNum)} style={{background:isCurrentWeek?"#1c1710":"var(--card-bg)",border:`1.5px solid ${isCurrentWeek?"#1c1710":"var(--rule)"}`,borderRadius:12,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,boxShadow:"2px 3px 0 rgba(0,0,0,.06)"}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:isCurrentWeek?"#f0e6cc":"var(--ink)"}}>Week {wNum}{isCurrentWeek?" — Current":""}</div>
                      {reviewSaved&&<div style={{fontFamily:"'Raleway',sans-serif",fontSize:8,letterSpacing:2,textTransform:"uppercase",color:"#c8993a",border:"1px solid #c8993a",borderRadius:4,padding:"2px 6px"}}>Reviewed</div>}
                    </div>
                    <div style={{height:4,background:isCurrentWeek?"rgba(255,255,255,.12)":"var(--bg3)",borderRadius:4,overflow:"hidden",marginBottom:4}}>
                      <div style={{height:"100%",width:`${pct}%`,background:pct>=80?"#c83a4f":pct>=60?"#c8993a":"rgba(240,230,204,.3)",borderRadius:4}}/>
                    </div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:isCurrentWeek?"rgba(240,230,204,.6)":"var(--ink2)"}}>{pct}% complete · {pastWDays.length} days logged</div>
                  </div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:isCurrentWeek?"rgba(240,230,204,.4)":"var(--ink3)"}}>→</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {reviewWeek&&<WeeklyReview appState={appState} weekNum={reviewWeek} onClose={()=>setReviewWeek(null)}/>}

      {selectedDay&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={()=>setSelectedDay(null)}>
          <div className="slide-up" onClick={e=>e.stopPropagation()} style={{background:"var(--bg)",width:"100%",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",maxHeight:"75vh",overflowY:"auto"}}>
            <div style={{width:40,height:4,background:"var(--rule)",borderRadius:2,margin:"0 auto 20px"}}/>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:2,marginBottom:12}}>{selectedDay}</div>
            {logs[selectedDay]?(
              <div>
                {logs[selectedDay]?.r8?.cal&&(
                  <div style={{background:"var(--bg2)",borderRadius:10,padding:"12px",marginBottom:14}}>
                    <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:8}}>Nutrition</div>
                    <div style={{display:"flex",gap:20}}>
                      <div><div style={{fontFamily:"'Abril Fatface',serif",fontSize:22,color:"var(--red)"}}>{logs[selectedDay].r8.cal}</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"var(--ink2)"}}>kcal</div></div>
                      <div><div style={{fontFamily:"'Abril Fatface',serif",fontSize:22,color:"var(--gold)"}}>{logs[selectedDay].r8.protein||"—"}g</div><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:10,color:"var(--ink2)"}}>protein</div></div>
                    </div>
                    {logs[selectedDay].r8.mealNotes&&<div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:12,color:"var(--ink2)",marginTop:8}}>"{logs[selectedDay].r8.mealNotes}"</div>}
                  </div>
                )}
                {appState.rules.map(r=>{
                  const l=logs[selectedDay]?.[r.id];
                  return(
                    <div key={r.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--rule)"}}>
                      <span style={{fontSize:20}}>{r.icon}</span>
                      <div style={{flex:1}}>
                        <div style={{fontFamily:"'Lora',serif",fontSize:14,fontWeight:500,color:l?.done?"var(--ink)":"var(--ink2)"}}>{r.name}</div>
                        {r.type==="workout"&&l?.wtype&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginTop:2}}>{l.wtype}{l.duration?` · ${l.duration}min`:""}</div>}
                        {r.type==="input"&&l?.source&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginTop:2}}>{l.source}{l.note?` — ${l.note}`:""}</div>}
                        {r.type==="build"&&l?.contentLog&&<div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginTop:2}}>Content: {l.contentLog.slice(0,60)}{l.contentLog.length>60?"…":""}</div>}
                      </div>
                      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:l?.done?"var(--red)":"var(--ink3)"}}>{l?.done?"✓":"—"}</div>
                    </div>
                  );
                })}
              </div>
            ):(
              <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",color:"var(--ink2)",fontSize:14}}>No data logged for this day.</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function BuildPage({appState}){
  const day=getCurrentDay(appState.startDate);
  const wk=day?Math.ceil(day/7):1;
  const focusIdx=wk<=2?0:wk<=4?1:wk<=6?2:wk<=8?3:wk<=10?4:5;
  const [roadmap,setRoadmap]=useState(()=>load("roadmap_v1",DEFAULT_ROADMAP));
  const [income,setIncome]=useState(()=>load("income_log",[]));
  const [content,setContent]=useState(()=>load("content_log",[]));
  const [newIncome,setNewIncome]=useState({amount:"",source:""});
  const [newContent,setNewContent]=useState({title:"",type:"video",status:"idea"});
  const [expanded,setExpanded]=useState(focusIdx);
  const [editingRoadmap,setEditingRoadmap]=useState(null);

  useEffect(()=>save("income_log",income),[income]);
  useEffect(()=>save("content_log",content),[content]);
  useEffect(()=>save("roadmap_v1",roadmap),[roadmap]);

  const totalIncome=income.reduce((a,b)=>a+(Number(b.amount)||0),0);
  const focus=roadmap[focusIdx];

  function updateGoal(ri,gi,val){setRoadmap(rm=>rm.map((r,i)=>i===ri?{...r,goals:r.goals.map((g,j)=>j===gi?val:g)}:r));}
  function deleteGoal(ri,gi){setRoadmap(rm=>rm.map((r,i)=>i===ri?{...r,goals:r.goals.filter((_,j)=>j!==gi)}:r));}
  function addGoal(ri){setRoadmap(rm=>rm.map((r,i)=>i===ri?{...r,goals:[...r.goals,""]}:r));}
  function updateFocus(ri,val){setRoadmap(rm=>rm.map((r,i)=>i===ri?{...r,focus:val}:r));}

  return(
    <div style={{paddingBottom:90}}>
      <Ticker/>
      <div style={{padding:"20px 20px 0"}}>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:48,letterSpacing:-2,lineHeight:.9,color:"var(--ink)"}}>Build</div>
        <div style={{fontFamily:"'Dancing Script',cursive",fontSize:22,color:"var(--red)"}}>content + income</div>
      </div>
      <div style={{margin:"16px 20px 0",background:"#1c1710",borderRadius:14,padding:"20px",position:"relative",overflow:"hidden",boxShadow:"3px 4px 0 rgba(0,0,0,.15)"}}>

function SovereigntyTimer(){
  const practices=[
    {key:"scripting",icon:"✍️",title:"Scripting",seconds:180,color:"#6b5a4e"},
    {key:"stillness",icon:"🌊",title:"Stillness",seconds:180,color:"#3d5a6b"},
    {key:"gratitude",icon:"🙏",title:"Gratitude",seconds:180,color:"#5a4e6b"},
    {key:"intention",icon:"🎯",title:"Intention",seconds:60,color:"#3d6b52"},
  ];
  const [activeIdx,setActiveIdx]=useState(null);
  const [timeLeft,setTimeLeft]=useState(0);
  const [running,setRunning]=useState(false);
  const [done,setDone]=useState({});
  const [promptIdx,setPromptIdx]=useState({scripting:0,stillness:0,gratitude:0,intention:0});
  const [spinning,setSpinning]=useState(false);
  const iv=useRef(null);

  function startPractice(idx){clearInterval(iv.current);setRunning(false);setActiveIdx(idx);setTimeLeft(practices[idx].seconds);}
  function toggleTimer(){
    if(running){clearInterval(iv.current);setRunning(false);}
    else{
      setRunning(true);
      iv.current=setInterval(()=>{
        setTimeLeft(t=>{
          if(t<=1){clearInterval(iv.current);setRunning(false);setDone(d=>({...d,[practices[activeIdx].key]:true}));return 0;}
          return t-1;
        });
      },1000);
    }
  }
  function spinWheel(){
    if(activeIdx===null)return;
    const key=practices[activeIdx].key;
    setSpinning(true);
    setTimeout(()=>{setPromptIdx(s=>({...s,[key]:(s[key]+1)%SOVEREIGNTY_PROMPTS[key].length}));setSpinning(false);},500);
  }
  useEffect(()=>()=>clearInterval(iv.current),[]);

  const ap=activeIdx!==null?practices[activeIdx]:null;
  const pct=ap?(1-(timeLeft/ap.seconds))*100:0;
  const C=2*Math.PI*40;

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {practices.map((p,i)=>(
          <div key={p.key} onClick={()=>startPractice(i)} style={{background:activeIdx===i?p.color:"var(--card-bg)",border:`1.5px solid ${activeIdx===i?p.color:"var(--rule)"}`,borderRadius:14,padding:"14px 16px",cursor:"pointer",position:"relative",transition:"all .2s",boxShadow:activeIdx===i?"0 4px 14px rgba(0,0,0,.18)":"none"}}>
            {done[p.key]&&<div style={{position:"absolute",top:8,right:10,fontSize:14,color:"#4caf50"}}>✓</div>}
            <div style={{fontSize:24,marginBottom:6}}>{p.icon}</div>
            <div style={{fontFamily:"'Lora',serif",fontSize:15,fontWeight:500,color:activeIdx===i?"#fff":"var(--ink)"}}>{p.title}</div>
            <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:activeIdx===i?"rgba(255,255,255,.65)":"var(--ink2)",marginTop:2}}>{p.seconds/60} min</div>
          </div>
        ))}
      </div>
      {ap&&(
        <div className="fade-in" style={{background:"var(--card-bg)",border:"1.5px solid var(--ink)",borderRadius:16,padding:"22px 20px",marginBottom:16,boxShadow:"3px 4px 0 rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:20}}>
            <div style={{position:"relative",width:100,height:100,marginBottom:14}}>
              <svg width="100" height="100" style={{transform:"rotate(-90deg)"}}>
                <circle cx="50" cy="50" r="40" fill="none" stroke="var(--bg3)" strokeWidth="7"/>
                <circle cx="50" cy="50" r="40" fill="none" stroke={ap.color} strokeWidth="7"
                  strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} strokeLinecap="round"
                  style={{transition:"stroke-dashoffset .5s ease"}}/>
              </svg>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color:"var(--ink)",letterSpacing:1}}>{fmtTime(timeLeft)}</div>
            </div>
            <div style={{fontFamily:"'Lora',serif",fontSize:18,fontWeight:500,color:"var(--ink)",marginBottom:12}}>{ap.title}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={toggleTimer} style={{padding:"12px 28px",background:running?"var(--ink)":ap.color,color:"#fff",border:"none",borderRadius:12,fontFamily:"'DM Sans',sans-serif",fontSize:15,fontWeight:700,minWidth:100}}>{timeLeft===0?"Done ✓":running?"Pause":"Start"}</button>
              <button onClick={()=>{clearInterval(iv.current);setRunning(false);setTimeLeft(ap.seconds);}} style={{padding:"12px 18px",background:"none",border:"1.5px solid var(--rule)",borderRadius:12,fontFamily:"'DM Sans',sans-serif",fontSize:14,color:"var(--ink2)"}}>Reset</button>
            </div>
          </div>
          <div style={{borderTop:"1px solid var(--rule)",paddingTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)"}}>Prompt Wheel</div>
              <button onClick={spinWheel} style={{background:"none",border:"1.5px solid var(--rule)",borderRadius:8,padding:"6px 14px",fontFamily:"'Raleway',sans-serif",fontSize:12,color:"var(--ink2)",display:"flex",alignItems:"center",gap:6}}>
                <span className={spinning?"wheel-spin":""} style={{display:"inline-block"}}>🎡</span> Spin
              </button>
            </div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:16,color:"var(--ink)",lineHeight:1.65,background:"var(--bg2)",borderRadius:10,padding:"14px 16px"}}>
              {SOVEREIGNTY_PROMPTS[ap.key][promptIdx[ap.key]]}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function BookSpine({book,selected,onSelect}){
  const [coverUrl,setCoverUrl]=useState(null);
  const colorIdx=parseInt(book.id.replace(/\D/g,""))%9;
  useEffect(()=>{
    if(book.olid){
      const url=`https://covers.openlibrary.org/b/olid/${book.olid}-M.jpg`;
      const img=new Image();
      img.onload=()=>{if(img.naturalWidth>1)setCoverUrl(url);};
      img.onerror=()=>setCoverUrl(null);
      img.src=url;
    }
  },[book.olid]);
  const statusDot=book.status==="done"?"#4caf50":book.status==="reading"?"var(--gold)":"transparent";
  const base={width:46,height:168,borderRadius:"4px 4px 0 0",cursor:"pointer",position:"relative",flexShrink:0,
    boxShadow:selected?"3px 0 0 var(--red),-1px 3px 10px rgba(0,0,0,.3)":"2px 3px 10px rgba(0,0,0,.2)",
    transform:selected?"translateY(-14px)":"translateY(0)",transition:"transform .22s,box-shadow .22s"};
  if(coverUrl){
    return(
      <div onClick={()=>onSelect(selected?null:book.id)} style={{...base,overflow:"hidden"}}>
        <img src={coverUrl} alt={book.title} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.05)"}}/>
        <div style={{position:"absolute",bottom:6,left:"50%",transform:"translateX(-50%)",width:7,height:7,borderRadius:"50%",background:statusDot,border:"1.5px solid rgba(255,255,255,.6)"}}/>
      </div>
    );
  }
  return(
    <div onClick={()=>onSelect(selected?null:book.id)} className={`sp${colorIdx}`} style={{...base,display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,.1)"}}>
      <div style={{writingMode:"vertical-rl",textOrientation:"mixed",transform:"rotate(180deg)",fontFamily:"'Raleway',sans-serif",fontSize:8,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(255,255,255,.88)",padding:"8px 0",lineHeight:1.2,textAlign:"center",maxHeight:148,overflow:"hidden"}}>{book.title}</div>
      <div style={{position:"absolute",bottom:6,left:"50%",transform:"translateX(-50%)",width:7,height:7,borderRadius:"50%",background:statusDot,border:"1.5px solid rgba(255,255,255,.3)"}}/>
    </div>
  );
}

                </div>
                <button onClick={()=>deleteBook(sel.id)} style={{background:"none",border:"none",fontSize:20,color:"var(--ink3)",padding:"0 4px"}}>×</button>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                {["unread","reading","done"].map(s=>(
                  <button key={s} onClick={()=>updateBook(sel.id,{status:s})} style={{flex:1,padding:"9px 0",border:`1.5px solid ${sel.status===s?"var(--ink)":"var(--rule)"}`,borderRadius:10,background:sel.status===s?"var(--ink)":"none",color:sel.status===s?"var(--bg)":"var(--ink2)",fontFamily:"'DM Sans',sans-serif",fontSize:12,fontWeight:600}}>
                    {s==="unread"?"Unread":s==="reading"?"Reading":"Done ✓"}
                  </button>
                ))}
              </div>
              {editingBook===sel.id?(
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <input defaultValue={sel.title} onBlur={e=>updateBook(sel.id,{title:e.target.value})} className="field" placeholder="Title"/>
                  <input defaultValue={sel.author} onBlur={e=>updateBook(sel.id,{author:e.target.value})} className="field" placeholder="Author"/>
                  <input defaultValue={sel.olid||""} onBlur={e=>updateBook(sel.id,{olid:e.target.value})} className="field" placeholder="Open Library ID (e.g. OL28277047M)"/>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",lineHeight:1.4}}>Find the ID at openlibrary.org — it's in the book URL</div>
                  <button onClick={()=>setEditingBook(null)} style={{padding:"11px",background:"var(--ink)",color:"var(--bg)",border:"none",borderRadius:10,fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700}}>Done</button>
                </div>
              ):(
                <button onClick={()=>setEditingBook(sel.id)} style={{width:"100%",padding:"10px",background:"none",border:"1px solid var(--rule)",borderRadius:10,fontFamily:"'Raleway',sans-serif",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Edit Details</button>
              )}
            </div>
          )}
          {showAddBook&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={()=>setShowAddBook(false)}>
              <div className="slide-up" onClick={e=>e.stopPropagation()} style={{background:"var(--bg)",width:"100%",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px"}}>
                <div style={{width:40,height:4,background:"var(--rule)",borderRadius:2,margin:"0 auto 20px"}}/>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,marginBottom:14}}>Add a Book</div>
                <input placeholder="Book title" value={newBook.title} onChange={e=>setNewBook(s=>({...s,title:e.target.value}))} className="field" style={{marginBottom:10}}/>
                <input placeholder="Author" value={newBook.author} onChange={e=>setNewBook(s=>({...s,author:e.target.value}))} className="field" style={{marginBottom:10}}/>
                <input placeholder="Open Library ID (optional — for real cover)" value={newBook.olid} onChange={e=>setNewBook(s=>({...s,olid:e.target.value}))} className="field" style={{marginBottom:6}}/>
                <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:16,lineHeight:1.4}}>Find it at openlibrary.org → search the book → copy the ID from the URL (e.g. OL28277047M)</div>
                <button onClick={addBook} style={{width:"100%",padding:16,background:"var(--ink)",color:"var(--bg)",border:"none",borderRadius:12,fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:3}}>Add to Shelf</button>
              </div>
            </div>
          )}
        </div>
      )}

      {sub==="sovereignty"&&(
        <div style={{padding:"20px 20px 0"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,marginBottom:4}}>Morning Sovereignty</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:13,color:"var(--ink2)",marginBottom:20,lineHeight:1.5}}>Tap a practice, hit start, and spin the prompt wheel for inspiration.</div>
          <SovereigntyTimer/>
        </div>
      )}

      {sub==="laws"&&(
        <div style={{padding:"20px"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,marginBottom:18}}>The Three Laws</div>
          {[
            {law:"State Determines Experience",desc:"The version of you who is fit, wealthy, eloquent and powerful already exists. Inhabit that state now — not after the results arrive."},
            {law:"Revision Is Real",desc:"Every night before sleep, replay one moment from the day as you wished it had gone. Your brain cannot fully distinguish vividly imagined from real."},
            {law:"Persistence Is The Only Variable",desc:"Every person who has consistently assumed a new identity and acted from it has become it. The only question is whether you persist long enough."},
          ].map((item,i)=>(
            <div key={i} style={{background:"#1c1710",borderRadius:14,padding:"20px",marginBottom:12,boxShadow:"3px 4px 0 rgba(0,0,0,.12)"}}>
              <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#c8993a",marginBottom:6}}>Law {i+1}</div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:"#f0e6cc",marginBottom:10}}>{item.law}</div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"rgba(240,230,204,.78)",lineHeight:1.7}}>{item.desc}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function JournalPage({appState}){
  const [entries,setEntries]=useState(()=>load("journal_entries",{}));
  const [selected,setSelected]=useState(todayKey());
  const [showAll,setShowAll]=useState(false);

  useEffect(()=>save("journal_entries",entries),[entries]);
  function updateEntry(field,val){setEntries(s=>({...s,[selected]:{...(s[selected]||{}),[field]:val}}));}

  const entry=entries[selected]||{};
  const allDates=Object.keys(entries).sort((a,b)=>b.localeCompare(a));
  const promptIdx=(()=>{const d=new Date(selected);return(d.getDate()+d.getMonth())%JOURNAL_PROMPTS.length;})();

  return(
    <div style={{paddingBottom:90}}>
      <Ticker/>
      <div style={{padding:"20px 20px 0"}}>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:48,letterSpacing:-2,lineHeight:.9,color:"var(--ink)"}}>Journal</div>
        <div style={{fontFamily:"'Dancing Script',cursive",fontSize:22,color:"var(--red)"}}>evening reflection</div>
      </div>
      <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:13,color:"var(--ink2)",padding:"8px 20px 14px",borderBottom:"1.5px solid var(--ink)"}}>Write in your physical journal. Use these prompts as your guide.</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",borderBottom:"1px solid var(--rule)"}}>
        <button onClick={()=>{const d=new Date(selected);d.setDate(d.getDate()-1);setSelected(d.toISOString().split("T")[0]);}} style={{background:"none",border:"1.5px solid var(--rule)",borderRadius:10,padding:"8px 16px",fontSize:14,color:"var(--ink2)"}}>← Prev</button>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700,color:"var(--ink)"}}>{selected}</div>
        <button onClick={()=>{const d=new Date(selected);d.setDate(d.getDate()+1);setSelected(d.toISOString().split("T")[0]);}} disabled={selected>=todayKey()} style={{background:"none",border:"1.5px solid var(--rule)",borderRadius:10,padding:"8px 16px",fontSize:14,color:selected>=todayKey()?"var(--ink3)":"var(--ink2)"}}>Next →</button>
      </div>
      <div style={{margin:"16px 20px"}}>
        <div style={{background:"#1c1710",borderRadius:14,padding:"18px",position:"relative",boxShadow:"3px 4px 0 rgba(0,0,0,.12)"}}>
          <div style={{position:"absolute",top:-13,left:20,fontSize:22,transform:"rotate(-20deg)"}}>📌</div>
          <div style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:4,textTransform:"uppercase",color:"#c8993a",marginBottom:8}}>Today's Manifesting Prompt</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:17,color:"#f0e6cc",lineHeight:1.55}}>{JOURNAL_PROMPTS[promptIdx]}</div>
        </div>
      </div>
      <div style={{padding:"0 20px"}}>
        {[
          {field:"revision",label:"01 — Evening Revision",prompt:"One moment from today you'd rewrite. Replay it exactly as you wish it went.",icon:"🔄"},
          {field:"learned",label:"02 — What I Learned",prompt:"One thing I know now that I didn't this morning.",icon:"🧠"},
          {field:"newMe",label:"03 — She Did It",prompt:"One thing I did today that the old me would have skipped or talked herself out of.",icon:"✦"},
          {field:"scary",label:"04 — Weekly Scary Thing",prompt:"Something I did this week that scared me. How did it feel after?",icon:"🔥"},
        ].map(item=>(
          <div key={item.field} style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <span style={{fontSize:17}}>{item.icon}</span>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:17,letterSpacing:2,color:"var(--ink)"}}>{item.label}</div>
            </div>
            <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:12,color:"var(--ink2)",marginBottom:8,lineHeight:1.5}}>{item.prompt}</div>
            <textarea value={entry[item.field]||""} onChange={e=>updateEntry(item.field,e.target.value)} rows={3} placeholder="Write here..." className="field" style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:16,lineHeight:1.6}}/>
          </div>
        ))}
      </div>
      <div style={{padding:"8px 20px 0"}}>
        <button onClick={()=>setShowAll(!showAll)} style={{width:"100%",padding:"14px",border:"1.5px solid var(--ink)",borderRadius:12,background:"none",fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:3,color:"var(--ink)"}}>{showAll?"HIDE":"VIEW ALL ENTRIES"} ({allDates.length})</button>
        {showAll&&(
          <div style={{marginTop:12}}>
            {allDates.map(date=>{
              const e=entries[date];
              if(!e||(!(e.revision||e.learned||e.newMe||e.scary)))return null;
              return(
                <div key={date} onClick={()=>{setSelected(date);setShowAll(false);window.scrollTo(0,0);}} style={{background:"var(--card-bg)",border:"1px solid var(--rule)",borderRadius:10,padding:"12px 16px",marginBottom:8,cursor:"pointer"}}>
                  <div style={{fontFamily:"'Lora',serif",fontSize:14,fontWeight:600,marginBottom:4}}>{date}</div>
                  <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:12,color:"var(--ink2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.revision||e.learned||e.newMe||"Entry saved"}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsModal({appState,setAppState,onClose}){
  const [names,setNames]=useState(appState.rules.map(r=>r.name));
  const [challengeName,setChallengeName]=useState(()=>load("challenge_name","Iz's Lock In"));
  const [waterTarget,setWaterTarget]=useState(()=>load("water_target",3000));
  const [stepTarget,setStepTarget]=useState(()=>load("step_target",10000));
  const [readingTarget,setReadingTarget]=useState(()=>load("reading_target",10));
  const [calMin,setCalMin]=useState(()=>load("cal_target_min",1100));
  const [calMax,setCalMax]=useState(()=>load("cal_target_max",1400));
  const [protMin,setProtMin]=useState(()=>load("prot_target_min",100));
  const [protMax,setProtMax]=useState(()=>load("prot_target_max",140));
  const [carbMax,setCarbMax]=useState(()=>load("carb_target_max",0));
  const [fatMax,setFatMax]=useState(()=>load("fat_target_max",0));
  const [showDanger,setShowDanger]=useState(false);
  const [startDateEdit,setStartDateEdit]=useState(appState.startDate||"");

  function saveAll(){
    const updates={rules:appState.rules.map((r,i)=>({...r,name:names[i]}))};
    if(startDateEdit&&startDateEdit!==appState.startDate){
      updates.startDate=startDateEdit;
      if(!appState.startTime)updates.startTime=new Date(startDateEdit).toISOString();
    }
    setAppState(s=>({...s,...updates}));
    save("challenge_name",challengeName);save("water_target",Number(waterTarget));
    save("step_target",Number(stepTarget));save("reading_target",Number(readingTarget));
    save("cal_target_min",Number(calMin));save("cal_target_max",Number(calMax));
    save("prot_target_min",Number(protMin));save("prot_target_max",Number(protMax));
    save("carb_target_max",Number(carbMax));save("fat_target_max",Number(fatMax));
    onClose();
  }
  function resetChallenge(){
    if(window.confirm("Clear ALL progress? This cannot be undone.")){
      setAppState(()=>({startDate:null,startTime:null,logs:{},rules:appState.rules.map(r=>({...r})),restarts:[],books:appState.books}));
      onClose();
    }
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
      <div className="slide-up" style={{background:"var(--bg)",width:"100%",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{width:40,height:4,background:"var(--rule)",borderRadius:2,margin:"0 auto 20px"}}/>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:2,marginBottom:4}}>Settings</div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:13,color:"var(--ink2)",marginBottom:20}}>Personalise your challenge.</div>
        <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:8}}>Challenge Name</div>
        <input value={challengeName} onChange={e=>setChallengeName(e.target.value)} className="field" style={{marginBottom:16}}/>
        <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:8}}>Challenge Start Date</div>
        <input type="date" value={startDateEdit} onChange={e=>setStartDateEdit(e.target.value)} className="field" style={{marginBottom:6}}/>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:20,lineHeight:1.4}}>Change this if you started the challenge before you set up the app. Your logged days will recalculate automatically.</div>
        <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:10}}>Daily Targets</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:6}}>💧 Water (ml)</div><input type="number" value={waterTarget} onChange={e=>setWaterTarget(e.target.value)} className="field"/></div>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:6}}>👟 Steps</div><input type="number" value={stepTarget} onChange={e=>setStepTarget(e.target.value)} className="field"/></div>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:6}}>📖 Pages</div><input type="number" value={readingTarget} onChange={e=>setReadingTarget(e.target.value)} className="field"/></div>
        </div>
        <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:6}}>🥗 Nutrition Targets</div>
        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:10,lineHeight:1.4}}>Set a range for calories — the bar turns green when you're inside it, red when over. Leave carbs/fat at 0 to hide those fields.</div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Cal min</div><input type="number" value={calMin} onChange={e=>setCalMin(e.target.value)} className="field" placeholder="e.g. 1100"/></div>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Cal max</div><input type="number" value={calMax} onChange={e=>setCalMax(e.target.value)} className="field" placeholder="e.g. 1400"/></div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Protein min (g)</div><input type="number" value={protMin} onChange={e=>setProtMin(e.target.value)} className="field" placeholder="e.g. 100"/></div>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Protein max (g)</div><input type="number" value={protMax} onChange={e=>setProtMax(e.target.value)} className="field" placeholder="e.g. 140"/></div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Carbs max (g, 0=hide)</div><input type="number" value={carbMax} onChange={e=>setCarbMax(e.target.value)} className="field" placeholder="e.g. 120"/></div>
          <div style={{flex:1}}><div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"var(--ink2)",marginBottom:5}}>Fat max (g, 0=hide)</div><input type="number" value={fatMax} onChange={e=>setFatMax(e.target.value)} className="field" placeholder="e.g. 60"/></div>
        </div>
        <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink2)",marginBottom:10}}>Rule Names</div>
        {appState.rules.map((r,i)=>(
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
            <span style={{fontSize:22,flexShrink:0}}>{r.icon}</span>
            <input value={names[i]} onChange={e=>{const n=[...names];n[i]=e.target.value;setNames(n);}} className="field"/>
          </div>
        ))}
        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button onClick={onClose} style={{flex:1,padding:14,background:"none",border:"1.5px solid var(--ink)",borderRadius:12,fontFamily:"'Raleway',sans-serif",fontSize:12,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Cancel</button>
          <button onClick={saveAll} style={{flex:2,padding:14,background:"var(--ink)",border:"none",borderRadius:12,color:"var(--bg)",fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:3}}>Save</button>
        </div>
        <div style={{marginTop:28,borderTop:"1px solid var(--rule)",paddingTop:20}}>
          <div style={{fontFamily:"'Raleway',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"var(--ink3)",marginBottom:10}}>Danger Zone</div>
          {!showDanger?(
            <button onClick={()=>setShowDanger(true)} style={{width:"100%",padding:13,background:"none",border:"1px solid var(--rule)",borderRadius:10,fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"var(--ink3)"}}>Reset Challenge Progress</button>
          ):(
            <div>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"var(--red)",marginBottom:10,lineHeight:1.4}}>This clears all daily logs. Books and roadmap stay. Cannot be undone.</div>
              <button onClick={resetChallenge} style={{width:"100%",padding:13,background:"var(--red)",border:"none",borderRadius:10,fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700,color:"#fff"}}>Yes, Reset Everything</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("today");
  const [showSettings,setShowSettings]=useState(false);
  const [appState,setAppStateRaw]=useState(()=>load("app_state_v3",{
    startDate:null,startTime:null,logs:{},
    rules:DEFAULT_RULES.map(r=>({...r,name:r.defaultName})),
    restarts:[],books:DEFAULT_BOOKS,
  }));

  function setAppState(fn){
    setAppStateRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      save("app_state_v3",next);
      return next;
    });
  }

  return(
    <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",position:"relative"}}>
      <div style={{overflowY:"auto",height:"calc(100dvh - 64px - var(--safe-bottom))"}}>
        {tab==="today"&&<TodayPage appState={appState} setAppState={setAppState}/>}
        {tab==="journey"&&<JourneyPage appState={appState}/>}
        {tab==="build"&&<BuildPage appState={appState} setAppState={setAppState}/>}
        {tab==="mind"&&<MindPage appState={appState} setAppState={setAppState}/>}
        {tab==="journal"&&<JournalPage appState={appState}/>}
      </div>
      <nav className="nav-bar">
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className={`nav-btn${tab===t.id?" active":""}`}>
            <span style={{fontSize:17,color:tab===t.id?"var(--red)":"var(--ink3)"}}>{t.icon}</span>
            <span style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:tab===t.id?"var(--red)":"var(--ink2)"}}>{t.label}</span>
          </button>
        ))}
        <button onClick={()=>setShowSettings(true)} className="nav-btn" style={{flex:.65}}>
          <span style={{fontSize:17,color:"var(--ink3)"}}>⚙</span>
          <span style={{fontFamily:"'Raleway',sans-serif",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Edit</span>
        </button>
      </nav>
      {showSettings&&<SettingsModal appState={appState} setAppState={setAppState} onClose={()=>setShowSettings(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
