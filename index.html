                      return (
                        <div key={date} onClick={()=>{setSelected(date);setShowAll(false);window.scrollTo(0,0)}} style={{background:"var(--surface)",border:"1px solid var(--rule)",borderRadius:2,padding:"10px 14px",marginBottom:8,cursor:"pointer"}}>
                          <div style={{fontFamily:"'Playfair Display',serif",fontSize:13,fontWeight:700,marginBottom:4}}>{date}</div>
                          <div style={{fontFamily:"'Raleway',sans-serif",fontStyle:"italic",fontSize:11,color:"var(--ink2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.revision||e.learned||e.newMe||"Entry saved"}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          );
        }
        
        function SettingsModal({ rules, onSave, onClose }) {
          const [names, setNames] = useState(rules.map(r=>r.name));
          return (
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
              <div className="slide-up" style={{background:"var(--bg)",width:"100%",borderRadius:"12px 12px 0 0",padding:"24px 20px 40px",maxHeight:"80vh",overflowY:"auto"}}>
                <div style={{width:36,height:3,background:"var(--rule)",borderRadius:2,margin:"0 auto 20px"}}/>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:2,marginBottom:4}}>Edit Rule Names</div>
                <div style={{fontFamily:"'Raleway',sans-serif",fontStyle:"italic",fontSize:12,color:"var(--ink2)",marginBottom:16}}>Personalise your daily check-in.</div>
                {rules.map((r,i)=>(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                    <span style={{fontSize:20,flexShrink:0}}>{r.icon}</span>
                    <input value={names[i]} onChange={e=>{const n=[...names];n[i]=e.target.value;setNames(n)}} style={{flex:1,border:"1.5px solid var(--ink)",borderRadius:2,padding:"9px 12px",fontSize:13,background:"var(--surface)",color:"var(--ink)"}}/>
                  </div>
                ))}
                <div style={{display:"flex",gap:8,marginTop:16}}>
                  <button onClick={onClose} style={{flex:1,padding:12,background:"none",border:"1.5px solid var(--ink)",borderRadius:2,fontFamily:"'Raleway',sans-serif",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Cancel</button>
                  <button onClick={()=>onSave(names)} style={{flex:2,padding:12,background:"var(--ink)",border:"none",borderRadius:2,color:"var(--bg)",fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:3}}>Save Names</button>
                </div>
              </div>
            </div>
          );
        }
        
        function App() {
          const [tab, setTab] = useState("today");
          const [showSettings, setShowSettings] = useState(false);
          const [appState, setAppStateRaw] = useState(()=>load("app_state_v1",{
            startDate: null,
            startTime: null,
            logs: {},
            rules: DEFAULT_RULES.map(r=>({...r, name:r.defaultName})),
            restarts: [],
            books: DEFAULT_BOOKS,
          }));
        
          function setAppState(fn) {
            setAppStateRaw(prev=>{
              const next = typeof fn==="function" ? fn(prev) : fn;
              save("app_state_v1", next);
              return next;
            });
          }
        
          function saveRuleNames(names) {
            setAppState(s=>({...s, rules: s.rules.map((r,i)=>({...r,name:names[i]}))}));
            setShowSettings(false);
          }
        
          const tabStyle = (id) => ({
            flex:1,display:"flex",flexDirection:"column",alignItems:"center",
            justifyContent:"center",gap:2,padding:"8px 0",border:"none",
            background:"none",cursor:"pointer",
            borderTop: tab===id ? "2px solid var(--red)" : "2px solid transparent",
            transition:"border .15s",
          });
        
          return (
            <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",position:"relative"}}>
              <div style={{overflowY:"auto",height:"calc(100vh - 64px)"}}>
                {tab==="today" && <TodayPage appState={appState} setAppState={setAppState}/>}
                {tab==="journey" && <JourneyPage appState={appState}/>}
                {tab==="build" && <BuildPage appState={appState} setAppState={setAppState}/>}
                {tab==="mind" && <MindPage appState={appState} setAppState={setAppState}/>}
                {tab==="journal" && <JournalPage appState={appState}/>}
              </div>
        
              <div style={{
                position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
                width:"100%",maxWidth:430,
                background:"var(--bg)",
                borderTop:"2px solid var(--ink)",
                display:"flex",zIndex:100,
                paddingBottom:"env(safe-area-inset-bottom)",
              }}>
                {TABS.map(t=>(
                  <button key={t.id} onClick={()=>setTab(t.id)} style={tabStyle(t.id)}>
                    <span style={{fontSize:16,color: tab===t.id?"var(--red)":"var(--ink3)"}}>{t.icon}</span>
                    <span style={{fontFamily:"'Raleway',sans-serif",fontSize:8,letterSpacing:2,textTransform:"uppercase",color: tab===t.id?"var(--red)":"var(--ink2)"}}>{t.label}</span>
                  </button>
                ))}
                <button onClick={()=>setShowSettings(true)} style={{...tabStyle("settings"),flex:.6}}>
                  <span style={{fontSize:16,color:"var(--ink3)"}}>⚙</span>
                  <span style={{fontFamily:"'Raleway',sans-serif",fontSize:8,letterSpacing:2,textTransform:"uppercase",color:"var(--ink2)"}}>Edit</span>
                </button>
              </div>
        
              {showSettings && (
                <SettingsModal rules={appState.rules} onSave={saveRuleNames} onClose={()=>setShowSettings(false)}/>
              )}
            </div>
          );
        }
        
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
